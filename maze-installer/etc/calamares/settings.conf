# Maze Linux — Calamares configuration.
#
# Adapted from EndeavourOS's proven OFFLINE installer (settings_offline.conf):
# it copies the already-built live system to the target with `unpackfs` instead
# of running pacstrap, then finishes with Maze's own deploy-to-target.sh.
#
# Sequence trimmed to Maze's single, curated path (KDE Plasma, systemd-boot/UKI,
# optional LUKS). EndeavourOS-specific modules (eos_*, grubcfg, packagechooser,
# netinstall, windowsbootentry, dracut) were dropped; Maze uses mkinitcpio +
# systemd-boot and does its branding/secure-boot work in deploy-to-target.sh.
---
modules-search: [ local ]

instances:
# Mount /dev /proc /sys /run into the target (offline-install fix so mkinitcpio /
# kernel-install don't fail with "/dev must be mounted"). Runs right after
# unpackfs; un-chrooted; idempotent.
- id:       mountapi
  module:   shellprocess
  config:   shellprocess_mountapi.conf
# Drop /crypto_keyfile.bin from the initramfs FILES that initcpiocfg may have
# written (manual layouts without a separate unencrypted /boot). The UKI lives
# on the unencrypted ESP, so the keyfile must never be baked into it.
- id:       stripkeyfile
  module:   shellprocess
  config:   shellprocess_stripkeyfile.conf
# Maze finalisation: runs /usr/share/maze/install/deploy-to-target.sh against the
# freshly-installed target (branding, Plymouth, kernel params, Secure Boot/UKI
# signing, services, and the AUR / [mazelinux] app install). All Maze-specific
# install logic lives in this one script (shared with the live ISO config).
- id:       mazedeploy
  module:   shellprocess
  config:   shellprocess_mazedeploy.conf
# BlackArch was REMOVED from the installer: a pentest repo does not belong in the
# default install path (most users are not pentesters). It is now purely opt-in
# AFTER install — Maze Control Center and the Welcome app offer a one-click
# `maze-enable-blackarch` for the users who actually want it.

# The optional Maze application selection page (packagechooser) was removed:
# Maze apps & AUR packages are already on the live ISO (unpackfs copies them).
#
# VMware was REMOVED from the installer: vmware-workstation is an AUR package
# whose vendor-bundle build never succeeds in the offline/chroot install
# environment, and it failed on every run. It is now installed on demand,
# post-install, with the `maze-install-vmware` command (ships in maze-tools),
# which uses paru to fetch + build + configure it while the machine is online.

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs          # copy the live Maze system onto the target
  - shellprocess@mountapi   # bind /dev /proc /sys /run into target (offline fix)
  - machineid
  - locale
  - keyboard
  # luksbootkeyfile: on the default layout (ESP at /boot, unencrypted) it does
  # nothing. On manual layouts it creates /crypto_keyfile.bin on the encrypted
  # root so crypttab can unlock OTHER encrypted partitions (e.g. /home) without
  # a second passphrase. It never reaches the initramfs/UKI — see
  # shellprocess@stripkeyfile right after initcpiocfg below.
  - luksbootkeyfile
  - fstab
  - removeuser        # drop the live 'maze' user copied in by unpackfs
  - users             # create the real user from the Users page
  - networkcfg
  - displaymanager    # SDDM
  - hwclock
  # (No 'hardwaredetect' — that is NOT a stock Calamares module; it fails to load.
  #  Offline install doesn't need it: the copied live system already carries the
  #  drivers, and deploy-to-target.sh handles NVIDIA/early-KMS specifics.)
  # initcpiocfg writes the target's /etc/mkinitcpio.conf with the RIGHT HOOKS for
  # this install (critically the `encrypt`/`keyboard`/`keymap` hooks for LUKS;
  # unpackfs copied the LIVE mkinitcpio.conf, which has no encrypt hook).
  - initcpiocfg
  # Must follow initcpiocfg and precede every image build (initcpio, bootloader).
  - shellprocess@stripkeyfile
  # initcpio runs `mkinitcpio -P`. calamares-mount-api.sh has already emptied
  # every preset (PRESETS=(), layout=uki), so this is a harmless no-op kept for
  # parity with the stock Calamares sequence: the image that actually boots is
  # built by `kernel-install add` (its mkinitcpio + ukify plugins) in the
  # bootloader step below, and rebuilt by deploy-to-target.sh at the end.
  - initcpio
  # Maze is UEFI-only (the ISO ships no BIOS bootmode), so the bootloader module
  # always installs systemd-boot to the ESP — the GRUB/BIOS path is never taken.
  # The old `grubcfg` module (which only prepared /etc/default/grub for a BIOS
  # grub-install) is therefore dropped from the sequence.
  - bootloader        # systemd-boot to the ESP (+ UKI via kernel-install)
  - services-systemd
  - shellprocess@mazedeploy   # <-- Maze finalisation (deploy-to-target.sh)
  - umount
- show:
  - finished

branding: maze

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
