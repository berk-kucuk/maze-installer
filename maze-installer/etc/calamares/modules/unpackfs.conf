# Maze Linux — unpackfs (OFFLINE install).
#
# Copies the already-built live Maze system onto the freshly-partitioned target,
# instead of running pacstrap.
#
# SOURCE: /run/archiso/airootfs — the live system's read-only squashfs layer,
# mounted by the archiso initramfs hook. It is the pristine image: the overlay
# the live session writes to (/run/archiso/cowspace) sits ON TOP of it, so
# nothing done in the live session leaks into the install.
#
# It used to be the image FILE, /run/archiso/bootmnt/maze/x86_64/airootfs.sfs.
# That path exists only while the medium stays mounted. When archiso copies the
# image to RAM (copytoram, which its default "auto" does for any image under
# 4 GiB when RAM allows) it unmounts the medium and the file moves to
# /run/archiso/copytoram/ — and the install failed at once with "Bad unpackfs
# configuration: the source filesystem ... does not exist". The mounted layer
# is at the same place in both cases. (The ISO now boots with copytoram=n, but
# the installer must not depend on how the live system was started.)
#
# sourcefs "file": copy a directory with rsync as-is, without trying to mount
# it (it is already mounted). The rsync flags are the same as for a squashfs
# source — unpackfs only loop-mounts an image and then rsyncs the mount.
#
# NOTE: the top-level key is `unpack` (NOT `unpackfs`); the wrong key makes
# Calamares report "Bad unpackfs configuration / no configuration information".
---
unpack:
    - source: "/run/archiso/airootfs"
      sourcefs: "file"
      destination: ""
