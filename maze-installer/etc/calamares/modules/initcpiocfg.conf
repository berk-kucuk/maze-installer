# Maze Linux — initcpiocfg (mkinitcpio.conf HOOKS writer).
#
# Writes /etc/mkinitcpio.conf on the target with the correct HOOKS for THIS
# install. The module computes HOOKS automatically from the partition layout:
#   - base, udev, autodetect, microcode, kms, modconf, block, keyboard
#   - keymap, consolefont (for non-systemd setups)
#   - plymouth (if plymouth is detected on the target)
#   - encrypt (if root is on LUKS)
#   - filesystems, fsck (fsck only if not btrfs)
#   - resume (if swap is present)
#
# unpackfs copied the live mkinitcpio.conf (which has archiso-specific hooks
# like archiso_loop_mnt, archiso_pxe_* — useless on an installed system); this
# module overwrites the HOOKS line with the correct computed set.
#
# deploy-to-target.sh later adds nvidia MODULES and runs `mkinitcpio -P` once
# at the end, so the final initramfs has everything.
#
# NOTE: the `hooks` config key is NOT a flat list — it is an object with
# `prepend`/`append`/`remove` sub-keys (see initcpiocfg.schema.yaml). Passing a
# flat list causes `AttributeError: 'list' object has no attribute 'get'` in
# main.py. Leaving it out entirely lets the module compute everything itself,
# which is exactly what we want.
---
# Use the classic udev/busybox hooks (NOT the systemd sd-encrypt set) to match
# the rest of the Maze boot path.
useSystemdHook: false
