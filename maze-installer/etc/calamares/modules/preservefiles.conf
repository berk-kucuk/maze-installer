# Maze Linux — keep the installer's own log on the installed system.
#
# mazedeploy writes each step's log to /var/log/maze-installer/steps/; this puts
# Calamares' session log (partitioning, unpackfs, users, bootloader, and every
# line mazedeploy relayed) beside it. root-only: it names disks and the user.
#
# NOT `from: config` — that dumps Global Storage, which is not something to
# leave lying around on a privacy-first install.
---
files:
  - from: log
    dest: /var/log/maze-installer/calamares-session.log
    perm: root:root:600
