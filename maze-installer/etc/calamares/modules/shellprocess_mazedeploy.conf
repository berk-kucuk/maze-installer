# Maze Linux finalisation — run deploy-to-target.sh on the installed target.
#
# deploy-to-target.sh runs in the LIVE environment (where /etc/skel, the Maze
# branding assets and the live config all exist) and does its own arch-chroot
# into the target. So this runs UN-chrooted, passing the target root that
# Calamares mounted as the first argument (the ${ROOT} variable).
#
# Args passed to deploy-to-target.sh (see the header of that script):
#   $1 = target mountpoint            -> ${ROOT}
#   $2 = security-feature CSV         -> 'all' (every feature, the Maze default)
#   $3 = ignored                      -> '' (legacy slot, kept for compatibility)
# The Maze app set is not an argument: the script always installs the full
# default set (DEFAULT_MAZE_APPS).
#
# It is the slowest step: it brings the copied system up to date (pacman -Syu,
# can be 1-3 GB when the ISO is a few weeks old) and builds the AUR apps. When
# the timeout expires Calamares KILLS the script — possibly in the middle of a
# pacman transaction, which leaves a half-upgraded target — so the ceiling is
# generous (4 h): it exists to catch a truly hung step, not a slow connection.
---
dontChroot: true
timeout: 14400

script:
  # ${ROOT} is the Calamares target-mountpoint variable (NOT @@ROOT@@, which is
  # not substituted and would be passed literally).
  # $2 = "all" -> every security feature; $3 is unused.
  - command: "/usr/share/maze/install/deploy-to-target.sh ${ROOT} 'all' ''"
    timeout: 14400
