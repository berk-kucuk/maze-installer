# Maze Linux finalisation — the mazedeploy job module
# (/usr/lib/calamares/modules/mazedeploy/main.py).
#
# Runs deploy-to-target.sh against the freshly installed target ONE STEP AT A
# TIME: every step (steps/NN-*.sh) is its own process with its own timeout and
# log, and the progress bar shows which step is running and what it is doing.
# It runs in the LIVE environment (un-chrooted) and arch-chroots into the
# target itself; the target is Calamares' rootMountPoint.
#
# There is no global timeout any more. Each step carries its own (# @timeout in
# the step file): a step that hangs is stopped and reported, the others still
# run, and the install is reported FAILED at the end. The old shellprocess had
# one 4-hour ceiling for everything, and when it fired it killed the script
# wherever it was — possibly in the middle of a pacman transaction.
#
# Logs on the installed system: /var/log/maze-installer/ (steps/NN-name.log,
# warnings.txt, critical.txt, summary.txt) and /var/log/maze-install-summary.txt.
---
script:   "/usr/share/maze/install/deploy-to-target.sh"

# Security-feature CSV handed to the steps (85-services): "all" enables every
# feature; otherwise a comma-separated subset of apparmor,firewalld,auditd,clamav.
security: "all"
