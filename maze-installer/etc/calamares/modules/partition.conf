# Maze Linux — partition module (Calamares 3.4).
#
# Maze layout: a FAT32 EFI System Partition mounted at /boot (holds shim, the
# signed Unified Kernel Images and their recovery copies) and one root
# partition — btrfs by default, with the subvolume layout from mount.conf.
# LUKS2 full-disk encryption is offered and pre-selected. Disk swap is off by
# default because Maze uses zram (configured by deploy-to-target.sh).
#
# Everything a user can pick on this page must be something the Maze boot
# chain (mkinitcpio busybox hooks -> UKI -> systemd-boot/shim) and the deploy
# steps actually handle. Options that look harmless but are not (hibernate
# swap on LUKS, LVM) are left out on purpose; each one says why below.
---

# ---- EFI system partition --------------------------------------------------
efi:
    # The ESP IS /boot on Maze: the UKIs, shim and systemd-boot live together
    # on it, and every deploy step assumes so.
    mountPoint:      "/boot"
    # One UKI per installed kernel (linux + linux-lts) plus the signed
    # grubx64.efi and its .maze-prev fallback — each 50-250 MB depending on
    # GPU firmware — so 3 GiB avoids "no space left on ESP" for years.
    recommendedSize: 3GiB
    # What Calamares' manual-partitioning page warns about. It only WARNS —
    # it never stops an install — and it checks nothing at all under "Install
    # alongside" / "Replace a partition", which reuse the ESP already there.
    # The real check is mazepreflight (preflight.py): a reused ESP needs 400 MiB
    # free for Maze's boot images, and the install stops before the disk is
    # touched when it does not have them (the 100-300 MB ESP Windows creates).
    minimumSize:     1GiB
    label:           "ESP"

# ---- what "Erase disk" creates ----------------------------------------------
# One root partition using the whole disk (the ESP is prepended automatically).
#   - type: the GPT "Linux root (x86-64)" GUID from the Discoverable Partitions
#     Specification, so systemd and other tools recognise it as the root
#     partition instead of a generic "Linux filesystem".
#   - filesystem "unknown": use the file system picked in the drop-down below.
#     Calamares logs 'Filesystem "unknown" not found, using ext4' for this
#     line. The message is misleading and harmless: the entry is marked
#     Unknown, which is exactly what makes the drop-down choice apply
#     (PartUtils::canonicalFilesystemName; verified — a btrfs pick installs
#     btrfs).
#   - name: the GPT partition name AND the file-system label. 9 characters:
#     XFS allows at most 12, ext4 16.
partitionLayout:
    - name:        "maze-root"
      type:        "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
      filesystem:  "unknown"
      mountPoint:  "/"
      size:        100%

# ---- file systems -------------------------------------------------------------
# btrfs is the default: snapshots, rollback (maze-rollback), compression and
# the monthly scrub are built on it. The others are complete, supported
# installs — they just do without those features.
#   ext4  the classic, most conservative choice
#   xfs   strong with large files and parallel I/O
#   f2fs  designed for flash storage (SSD, NVMe, SD cards)
defaultFileSystemType:  "btrfs"
availableFileSystemTypes:
    - "btrfs"
    - "ext4"
    - "xfs"
    - "f2fs"

# Guard rails for MANUAL partitioning — the combinations Maze cannot boot are
# refused on this page instead of failing an hour later:
#   - the root file system must be one of the four above;
#   - /boot, when it is its own partition, must be the FAT32 ESP (Maze keeps
#     the UKIs on the ESP; a separate ext4 /boot would never be read);
#   - the ESP must be FAT32 (the UEFI specification);
#   - /home, /var and the like may use any of the four;
#   - anything else (e.g. mounting an existing NTFS data partition) is free.
directoryFilesystemRestrictions:
    - directory: "any"
      allowedFilesystemTypes: [ "all" ]
    - directory: "/"
      allowedFilesystemTypes: [ "btrfs", "ext4", "xfs", "f2fs" ]
    - directory: "/boot"
      allowedFilesystemTypes: [ "fat32" ]
      onlyWhenMountpoint: true
    - directory: "/home"
      allowedFilesystemTypes: [ "btrfs", "ext4", "xfs", "f2fs" ]
      onlyWhenMountpoint: true
    - directory: "/var"
      allowedFilesystemTypes: [ "btrfs", "ext4", "xfs", "f2fs" ]
      onlyWhenMountpoint: true
    - directory: "efi"
      allowedFilesystemTypes: [ "fat32" ]
      onlyWhenMountpoint: true

# ---- encryption ---------------------------------------------------------------
# LUKS2 (argon2id). Maze never needs the bootloader to read the encrypted
# volume — the UKI on the unencrypted ESP carries the initramfs that unlocks
# it — so the GRUB/LUKS1 limitation does not apply.
luksGeneration:  luks2
# Pre-tick "Encrypt system": a privacy-first system should be encrypted unless
# the user decides otherwise. One click unticks it.
preCheckEncryption: true
# No "boot partition not encrypted" warning: on Maze the unencrypted part is
# the ESP, which only ever holds signed boot images (and never the LUKS
# keyfile — see shellprocess@stripkeyfile). The warning would only alarm.
showNotEncryptedBootMessage: false

# ---- swap ---------------------------------------------------------------------
# zram (compressed RAM) is the everyday swap on every install. On top of it:
#   none  zram only (default)
#   file  also a swap FILE on the root file system (on btrfs: its own @swap
#         subvolume, see mount.conf), for machines with little RAM
#
# NOT offered: "small"/"suspend" swap PARTITIONS. On an encrypted install they
# make Calamares add the `openswap` mkinitcpio hook to unlock the separate
# encrypted swap — but that hook does not exist on Arch (it is
# mkinitcpio-openswap from Manjaro/CachyOS), so mkinitcpio aborts with
# "Hook 'openswap' cannot be found" and the install FAILS. Hibernate on LUKS
# needs that hook + luksopenswaphookcfg + resume wiring: a deliberate, tested
# feature to add later, not a choice to flip on blindly.
userSwapChoices:
    - none
    - file
initialSwapChoice: none
swapPartitionName: "maze-swap"

# ---- the choice page ----------------------------------------------------------
# Nothing pre-selected: "Erase disk" is destructive, so the user has to pick it
# on purpose rather than click past it.
initialPartitioningChoice: none
allowManualPartitioning:   true

# Logical partitions (MBR disks) drawn nested inside their extended partition,
# and every partition labelled, so the bar and the table are readable.
drawNestedPartitions:      true
alwaysShowPartitionLabels: true

# LVM buttons hidden in manual partitioning. Maze's boot chain detects a LUKS
# root by its /dev/mapper name (65-initramfs) and builds the cryptdevice=
# cmdline from it (70-cmdline-uki); LVM — and LVM on LUKS in particular — has
# never been tested through that path, so it is not offered until it has.
lvm:
    enable: false

# Partition table for "Erase disk": GPT on UEFI (Calamares' default there).
defaultPartitionTableType: gpt

# Live-medium mounts the "unmount everything" step before partitioning must
# leave alone (Calamares adds live-*, control and ventoy itself; listed for
# clarity).
essentialMounts: [ "live-*", "control", "ventoy" ]
