# Maze Linux — mount module.
#
# Mounts the freshly-created partitions before unpackfs copies the system in.
# btrfs roots get the standard subvolume layout (@, @home, @cache, @log) so the
# system is snapshot-friendly (Maze ships snapper/snap-pac) and noise dirs
# (caches, logs) are kept out of root snapshots. zstd compression on btrfs.
---
# NOTE: /dev, /dev/pts, /dev/shm and /run/udev are intentionally NOT mounted
# here. The shellprocess@mountapi step (calamares-mount-api.sh) is the single
# owner of the target's pseudo-filesystems: it mounts a FRESH devtmpfs on /dev
# plus tmpfs /dev/shm + devpts /dev/pts (deliberately NOT a bind/rbind, so
# tearing them down never propagates back to the live system's /dev). If we ALSO
# bind-mount /dev here, mountapi sees /dev already mounted, skips it, but still
# layers /dev/shm on top of the bind — and the `umount` module then fails to
# tear /dev/shm down ("not mounted"), aborting the install with "Could not
# unmount target system". unpackfs runs before mountapi and excludes /dev, so
# nothing needs /dev mounted this early. Keep only the simple, nesting-free
# proc/sys/run here.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run

extraMountsEfi:
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars

mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log
