# Maze Linux — bootloader module.
#
# Installs systemd-boot to the target ESP (mounted at /boot) and calls
# `kernel-install add` for every kernel found under kernelSearchPath (Calamares'
# systemd-boot backend always delegates entry creation to kernel-install — it
# never hand-writes BLS entries itself; see calamares src/modules/bootloader/
# main.py). Because airootfs/etc/kernel/install.conf ships `layout=uki`
# (present on the target from the moment unpackfs finishes, i.e. before this
# module runs), kernel-install builds a real Unified Kernel Image straight to
# $ESP/EFI/Linux/<machine-id>-<kver>.efi — no loose vmlinuz/initrd, no
# loader/entries/*.conf. deploy-to-target.sh's later `mkinitcpio -P` +
# `kernel-install add` re-run rebuilds that same UKI with the final kernel
# cmdline (quiet/splash/apparmor params appended) and Secure Boot signs it.
#
# NOTE: the ESP is mounted at /boot (see partition.conf: efiSystemPartition:
# "/boot").
#
# NOTE: Secure Boot (shim + per-machine MOK) IS wired in — deploy-to-target.sh's
# setup_secure_boot() signs the UKI kernel-install produced and installs shim.
# It also DELETES the "Linux Boot Manager" NVRAM entry that the `bootctl install`
# below creates: that entry points straight at the UNSIGNED systemd-bootx64.efi,
# and with Secure Boot ON the firmware would boot it and fail validation (MOK
# only counts when shim is in the chain). After cleanup the firmware boots only
# via shim (the "Maze Linux" entry or the removable \EFI\BOOT\BOOTX64.EFI
# fallback).
---
# Maze is UEFI-only: the ISO ships no BIOS bootmode (see profiledef.sh), so the
# live medium only boots on UEFI firmware and Calamares' bootloader module always
# takes the systemd-boot path (firmwareType == "efi"). The old grub* keys — only
# read on the BIOS/install_grub path — were removed together with the BIOS
# support. (BIOS forced a GRUB fallback whose i386-pc btrfs driver could not read
# the zstd-compressed kernel on the btrfs root: "premature end of file
# /@/boot/vmlinuz-linux". Secure Boot, a flagship feature, is UEFI-only anyway.)
efiBootLoader: "systemd-boot"

# Used by kernel-install (via Calamares' get_kernels()) to find installed
# kernels — NOT plain-BLS artifact paths (those keys don't exist in Calamares'
# bootloader.schema.yaml; additionalProperties is false, so unknown keys are
# just dead config).
kernelSearchPath:  "/usr/lib/modules"
kernelPattern:     "^vmlinuz.*"

# Boot straight into Maze. The systemd-boot menu often does not render on the
# firmware's post-handoff console, so any nonzero timeout is just a black-screen
# wait the user can't skip (and Plymouth then appears "late"). 0 = boot the
# default entry instantly; the menu is still reachable by holding a key.
# deploy-to-target.sh also forces `timeout 0` in loader.conf as a safety net.
timeout: "0"

# UEFI boot entry id (sanitised); also used for the loader directory.
efiBootloaderId: "Maze"

# Install the bootloader to the EFI removable fallback path (\EFI\BOOT\BOOTX64.EFI)
# as well, so the firmware boots it even on machines that drop NVRAM entries (VMs).
installEFIFallback: true
