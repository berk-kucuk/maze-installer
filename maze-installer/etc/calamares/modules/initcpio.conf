# Maze Linux — initcpio (mkinitcpio builder).
#
# Runs `mkinitcpio -P` on the target to build the initramfs images, AFTER
# initcpiocfg has written the correct HOOKS (including `encrypt` for LUKS).
# This MUST run before `bootloader`: the systemd-boot path uses `kernel-install`,
# which needs a built initramfs — without this step it fails with
# "kernel-install add ... returned error code 1".
#
# deploy-to-target.sh later re-runs `mkinitcpio -P` (to add plymouth/nvidia);
# the double build is harmless, last one wins.
---
# Run mkinitcpio for ALL installed kernel presets (mkinitcpio -P). This is the
# module's only real knob (schema allows just `kernel` + `be_unsafe` — there is
# NO compression option here; initramfs compression comes from the target's
# /etc/mkinitcpio.conf, and mkinitcpio defaults to zstd anyway).
kernel: all
