# Maze Linux — initcpio (mkinitcpio builder).
#
# Runs `mkinitcpio -P` on the target. calamares-mount-api.sh replaces every
# preset with an EMPTY one (PRESETS=()) because Maze boots Unified Kernel Images
# (layout=uki), so this step is a no-op kept for parity with the stock sequence.
# The initramfs that actually boots is built inside the UKI by `kernel-install
# add` (its 50-mkinitcpio + 60-ukify plugins) during the bootloader step, and
# rebuilt with the final HOOKS/cmdline by deploy-to-target.sh.
---
# Run mkinitcpio for ALL installed kernel presets (mkinitcpio -P). This is the
# module's only real knob (schema allows just `kernel` + `be_unsafe` — there is
# NO compression option here; initramfs compression comes from the target's
# /etc/mkinitcpio.conf, and mkinitcpio defaults to zstd anyway).
kernel: all
