# Maze Linux — the "Options" page (netinstall@mazeoptions).
#
# NOT a package installer here. Calamares' netinstall module is used only for
# its UI — a tree with a check box and a description per row, and a default
# per row — because packagechooser offers one default and Ctrl-click multiple
# selection, which is no way to present a list of toggles. There is no
# `packages` module in the exec sequence, so nothing is installed from this
# list: the mazedeploy job reads the ticked items back from Global Storage
# (packageOperations, source "netinstall@mazeoptions") and hands them to the
# deploy steps as MAZE_OPTIONS.
#
# Every item is one group holding one "package" whose name is the option id
# (opt-...). Groups, not packages, because only a group can have its own
# default (`selected`); a package inherits its group's.
#
# DEFAULTS ARE TODAY'S BEHAVIOUR: an install where nobody touches this page is
# the same install as before the page existed. Item names cannot be translated
# (netinstall takes them verbatim), hence "English · Türkçe".
---
label:
    sidebar:     "Options"
    sidebar[tr]: "Seçenekler"
    title:       "Choose what this installation includes"
    title[tr]:   "Bu kurulumda nelerin olacağını seçin"

required: false
groupsUrl: local

groups:
    # Always ticked and invisible: tells mazedeploy the page was seen, so a
    # user who unticked EVERYTHING is not mistaken for one who never saw it
    # (with nothing ticked, netinstall writes nothing at all).
    - name: "page-marker"
      description: "internal"
      hidden: true
      selected: true
      packages: [ "opt-page-seen" ]

    - name: "Security · Güvenlik"
      description: "Background protection · Arka plan korumaları"
      expanded: true
      subgroups:
          - name: "AppArmor"
            description: "Confines apps to their profiles · Uygulamaları sınırlar"
            selected: true
            packages: [ "opt-apparmor" ]
          - name: "Firewall · Güvenlik duvarı (firewalld)"
            description: "Blocks unwanted incoming traffic · Gelen trafiği süzer"
            selected: true
            packages: [ "opt-firewalld" ]
          - name: "Audit log · Denetim kaydı (auditd)"
            description: "Logs security events · Güvenlik olaylarını kaydeder"
            selected: true
            packages: [ "opt-auditd" ]
          - name: "ClamAV"
            description: "Virus signature updates · Virüs imzası güncellemeleri"
            selected: true
            packages: [ "opt-clamav" ]

    - name: "Services · Servisler"
      description: "Started at boot · Açılışta başlar"
      expanded: true
      subgroups:
          - name: "Ollama — local AI · yerel yapay zeka"
            description: "Needed by Maze AI · Maze AI için gerekli"
            selected: true
            packages: [ "opt-ollama" ]
          - name: "Tor"
            description: "Used by Maze privacy tools · Gizlilik araçları kullanır"
            selected: true
            packages: [ "opt-tor" ]
          - name: "Printing · Yazdırma (CUPS)"
            description: "Printer support · Yazıcı desteği"
            selected: true
            packages: [ "opt-cups" ]
          - name: "Bluetooth"
            description: "Bluetooth devices · Bluetooth aygıtları"
            selected: true
            packages: [ "opt-bluetooth" ]
          - name: "SSH server · SSH sunucusu"
            description: "Remote login, off by default · Uzaktan giriş, varsayılan kapalı"
            selected: false
            packages: [ "opt-sshd" ]

    - name: "Applications · Uygulamalar"
      description: "From the AUR · AUR'dan"
      expanded: true
      subgroups:
          - name: "ONLYOFFICE"
            description: "Office suite, ~350 MB download · Ofis paketi, ~350 MB"
            selected: true
            packages: [ "opt-app-onlyoffice-bin" ]
          - name: "Joplin"
            description: "Encrypted notes · Şifreli notlar"
            selected: true
            packages: [ "opt-app-joplin-bin" ]
          - name: "Upscayl"
            description: "AI image upscaling · Görüntü büyütme"
            selected: true
            packages: [ "opt-app-upscayl-bin" ]
          - name: "Session"
            description: "Private messenger · Gizli mesajlaşma"
            selected: true
            packages: [ "opt-app-session-desktop-bin" ]

    - name: "Install & boot · Kurulum ve açılış"
      description: "Install and startup · Kurulum ve açılış"
      expanded: true
      subgroups:
          - name: "Fastest mirrors · En hızlı aynalar"
            description: "Faster updates (reflector) · Daha hızlı güncelleme"
            selected: true
            packages: [ "opt-reflector" ]
          - name: "Verbose boot · Ayrıntılı açılış"
            description: "Messages, no splash · Logo yerine mesajlar"
            selected: false
            packages: [ "opt-verbose-boot" ]
