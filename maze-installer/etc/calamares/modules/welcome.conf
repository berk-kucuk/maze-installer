# Maze Linux — welcome page + system requirements.
#
# OFFLINE installer: the base system is copied from the live medium via
# unpackfs, so the CORE install itself needs no network. That is NOT what
# 'required' below reflects, though — see the comment on the `internet` entry
# in `required:` for why Calamares blocks the Install button without a
# connection anyway. (An earlier version of this file said the opposite here;
# this header used to match a config that no longer exists — don't let the two
# drift apart again.)
---
showSupportUrl:      true
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    requiredStorage:    20
    requiredRam:        2.0
    internetCheckUrl:   https://mazelinux.berkkucukk.com.tr
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root
        # Internet is MANDATORY: a Maze install pulls the AUR helper (paru), the
        # curated AUR apps (onlyoffice, optionally vmware-workstation), open-vm-tools
        # and — if chosen — the BlackArch repo over the network during
        # deploy-to-target.sh. Without a connection the core system boots but is
        # incomplete, so Calamares blocks the "Install" button (shown red) until the
        # machine is online.
        - internet
