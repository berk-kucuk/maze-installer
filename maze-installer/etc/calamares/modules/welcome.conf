# Maze Linux — welcome page + system requirements.
#
# OFFLINE installer: the base system is copied from the live medium via
# unpackfs, so the CORE install itself needs no network. That is NOT what
# 'required' below reflects, though — see the comment on the `internet` entry
# in `required:` for why Calamares blocks the Install button without a
# connection anyway. (An earlier version of this file said the opposite here;
# this header used to match a config that no longer exists — don't let the two
# drift apart again.)
---
showSupportUrl:      true
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    requiredStorage:    20
    requiredRam:        2.0
    # Checked one by one; any answer means "online". The Arch/AUR hosts come
    # first because they are what the install actually downloads from, and a
    # list keeps the Install button usable if any single site is down.
    internetCheckUrl:
        - https://archlinux.org
        - https://aur.archlinux.org
        - https://mazelinux.berkkucukk.com.tr
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root
        # Internet is MANDATORY: deploy-to-target.sh brings the copied system up
        # to date with the repos and builds the AUR helper (paru) and
        # onlyoffice-bin over the network. Without a connection the core system
        # boots but is incomplete, so Calamares blocks the "Install" button
        # (shown red) until the machine is online.
        - internet
