# Maze Linux — keep the LUKS keyfile out of the initramfs / UKI.
#
# Runs UN-chrooted right after `initcpiocfg` (which may have listed
# /crypto_keyfile.bin in mkinitcpio's FILES=()) and before `initcpio` and
# `bootloader` build the first image, so the keyfile never reaches the
# unencrypted ESP. See calamares-strip-keyfile.sh for the full reasoning.
# No-op on the default layout (ESP at /boot).
---
dontChroot: true
timeout: 60

script:
  - command: "/usr/local/share/maze/calamares-strip-keyfile.sh ${ROOT}"
    timeout: 60
